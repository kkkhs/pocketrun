<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 286" role="img" aria-labelledby="pr-vd-title pr-vd-desc" class="pr-vd-diagram">
  <title id="pr-vd-title">怎样把固定 Demo 放到虚拟屏并核对归属</title>
  <desc id="pr-vd-desc">已有 Binder 后端时，先创建无实体面板的 VirtualDisplay 并取得正数 displayId，再用固定 am start --display 启动 Demo，成功后把 ID 返回 App。用户读取状态，设备测试独立核对系统 display 与 Demo task 归属，最后释放显示和 ImageReader，使旧 ID 失效。本章不读取画面、UI 树或注入输入。</desc>
  <style>
    .pr-vd-diagram .card { fill: var(--panel); stroke: var(--border); stroke-width: 1.5; }
    .pr-vd-diagram .edge { fill: none; stroke: var(--muted); stroke-width: 2; }
    .pr-vd-diagram .heading { fill: var(--ink); font-size: 24px; font-weight: 650; }
    .pr-vd-diagram .body { fill: var(--ink); font-size: 20px; font-weight: 650; }
    .pr-vd-diagram .label { fill: var(--muted); font-size: 16px; }
  </style>
  <defs><marker id="pr-vd-arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 9 4 0 8Z" fill="var(--muted)"/></marker></defs>
  <text x="510" y="34" class="heading" text-anchor="middle">已有后端，怎样得到一块可确认的目标显示？</text>
  <g data-node="create">
    <rect x="20" y="78" width="200" height="126" rx="10" class="card"/>
    <text x="120" y="117" class="body" text-anchor="middle">创建显示</text>
    <text x="120" y="152" class="label" text-anchor="middle">720 × 1280</text>
    <text x="120" y="183" class="label" text-anchor="middle">displayId &gt; 0</text>
  </g>
  <path d="M220 141 H280" class="edge" marker-end="url(#pr-vd-arrow)"/>
  <g data-node="launch">
    <rect x="280" y="78" width="200" height="126" rx="10" class="card"/>
    <text x="380" y="117" class="body" text-anchor="middle">启动固定 Demo</text>
    <text x="380" y="152" class="label" text-anchor="middle">固定 am start</text>
    <text x="380" y="183" class="label" text-anchor="middle">成功后返回 ID 给 App</text>
  </g>
  <path d="M480 141 H540" class="edge" marker-end="url(#pr-vd-arrow)"/>
  <g data-node="verify">
    <rect x="540" y="78" width="200" height="126" rx="10" class="card"/>
    <text x="640" y="117" class="body" text-anchor="middle">核对归属</text>
    <text x="640" y="152" class="label" text-anchor="middle">系统显示确实存在</text>
    <text x="640" y="183" class="label" text-anchor="middle">task 属于同一 ID</text>
  </g>
  <path d="M740 141 H800" class="edge" marker-end="url(#pr-vd-arrow)"/>
  <g data-node="release">
    <rect x="800" y="78" width="200" height="126" rx="10" class="card"/>
    <text x="900" y="117" class="body" text-anchor="middle">释放显示</text>
    <text x="900" y="152" class="label" text-anchor="middle">关闭显示与图像资源</text>
    <text x="900" y="183" class="label" text-anchor="middle">旧 ID 失效</text>
  </g>
  <text x="510" y="243" class="body" text-anchor="middle">面板显示状态；设备测试独立核对系统 display 与 task。</text>
  <text x="510" y="272" class="label" text-anchor="middle">VirtualDisplay 不是虚拟机；画面、UI 树和输入留到第 5 章。</text>
</svg>
