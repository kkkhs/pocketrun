<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 690" role="img" aria-labelledby="pr-domains-title pr-domains-desc" class="pr-domains-diagram">
  <title id="pr-domains-title">完整应用的逻辑分工和运行身份</title>
  <desc id="pr-domains-desc">计划架构：UI把任务交给Agent，Agent通过受校验的工具入口请求执行。普通App UID一侧由Kotlin管理文件、ProcessBuilder、PRoot和PTY；ADB启动的shell UID2000后端负责虚拟屏、App启动、输入、截图和UI树。App通过Binder或本地命令通道访问后端。两侧共享Android系统和内核。Agent宿主仍需验证；当前仅实现UI调用Kotlin读取设备信息。</desc>
  <style>
    .pr-domains-diagram { --app: #2a78d6; --shell: #eb6834; --ink: var(--ifm-font-color-base, #1c1e21); --muted: var(--ifm-color-emphasis-700, #606770); --border: var(--ifm-color-emphasis-300, #dadde1); --panel: var(--ifm-background-surface-color, #fff); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    html[data-theme="dark"] .pr-domains-diagram { --app: #3987e5; --shell: #d95926; }
    .pr-domains-diagram .card { fill: var(--panel); stroke: var(--border); stroke-width: 1.5; }
    .pr-domains-diagram .zone { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 7 5; }
    .pr-domains-diagram .edge { fill: none; stroke: var(--muted); stroke-width: 2; }
    .pr-domains-diagram .heading { fill: var(--ink); font-size: 25px; font-weight: 650; }
    .pr-domains-diagram .body { fill: var(--ink); font-size: 21px; }
    .pr-domains-diagram .label { fill: var(--muted); font-size: 18px; }
  </style>
  <defs>
    <marker id="pr-domains-arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 9 4 0 8Z" fill="var(--muted)"/></marker>
    <marker id="pr-domains-start" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M9 0 0 4 9 8Z" fill="var(--muted)"/></marker>
  </defs>
  <text x="20" y="28" class="label">完整架构 · 按后续章节实现</text>
  <rect x="20" y="292" width="350" height="242" rx="12" class="zone"/>
  <rect x="430" y="292" width="350" height="242" rx="12" class="zone"/>

  <path d="M236 111 H292" class="edge" marker-start="url(#pr-domains-start)" marker-end="url(#pr-domains-arrow)"/>
  <path d="M508 111 H564" class="edge" marker-start="url(#pr-domains-start)" marker-end="url(#pr-domains-arrow)"/>
  <path d="M650 166 V232 Q650 240 642 240 H408 Q400 240 400 248 V403 Q400 411 392 411 H346" class="edge" marker-end="url(#pr-domains-arrow)"/>
  <path d="M694 166 V268 Q694 276 702 276 H784 Q792 276 792 284 V403 Q792 411 784 411 H754" class="edge" marker-end="url(#pr-domains-arrow)"/>
  <text x="440" y="227" class="label">请求交给对应执行通道</text>
  <path d="M324 482 V554 Q324 562 316 562 H203 Q195 562 195 570 V586" class="edge" marker-end="url(#pr-domains-arrow)"/>
  <path d="M734 482 V554 Q734 562 726 562 H613 Q605 562 605 570 V586" class="edge" marker-end="url(#pr-domains-arrow)"/>

  <g data-node="ui">
    <rect x="20" y="56" width="216" height="110" rx="10" class="card"/>
    <text x="42" y="94" class="heading">UI</text>
    <text x="42" y="127" class="body">任务、进度、接管</text>
    <text x="42" y="153" class="label">React Native</text>
  </g>
  <g data-node="agent">
    <rect x="292" y="56" width="216" height="110" rx="10" class="card"/>
    <text x="314" y="94" class="heading">Agent</text>
    <text x="314" y="127" class="body">决定下一步</text>
    <text x="314" y="153" class="label">宿主在第9章验证</text>
  </g>
  <g data-node="tools">
    <rect x="564" y="56" width="216" height="110" rx="10" class="card"/>
    <text x="586" y="94" class="heading">工具入口</text>
    <text x="586" y="127" class="body">校验、授权、结果</text>
    <text x="586" y="153" class="label">不由模型授予权限</text>
  </g>

  <circle cx="42" cy="324" r="6" fill="var(--app)"/>
  <text x="60" y="332" class="heading">普通 App UID</text>
  <rect x="452" y="318" width="12" height="12" rx="2" fill="var(--shell)"/>
  <text x="478" y="332" class="heading">shell UID 2000</text>
  <g data-node="app-runtime">
    <title>普通应用身份。PRoot提供Linux用户态兼容，不提升到shell或root权限。</title>
    <rect x="44" y="352" width="302" height="130" rx="9" class="card"/>
    <rect x="44" y="362" width="4" height="110" rx="2" fill="var(--app)"/>
    <text x="64" y="388" class="heading">Kotlin 执行管理</text>
    <text x="64" y="421" class="body">文件 / 命令管道</text>
    <text x="64" y="453" class="body">PRoot / Alpine / PTY</text>
  </g>
  <g data-node="shell-runtime">
    <title>App自有ADB连接启动shell后端。通过Binder和本地命令通道提供受授权的Android操作。</title>
    <rect x="454" y="352" width="300" height="130" rx="9" class="card"/>
    <rect x="454" y="362" width="4" height="110" rx="2" fill="var(--shell)"/>
    <text x="474" y="388" class="heading">Android 后端</text>
    <text x="474" y="421" class="body">虚拟屏 / 启动 / 输入</text>
    <text x="474" y="453" class="body">截图 / UI 树</text>
  </g>
  <text x="44" y="516" class="label">PRoot 不增加原有权限</text>
  <text x="454" y="516" class="label">自有 ADB 启动 · Binder / TCP</text>

  <g data-node="system">
    <rect x="20" y="586" width="760" height="78" rx="10" class="card"/>
    <text x="42" y="618" class="heading">同一个 Android 系统与 Linux 内核</text>
    <text x="42" y="649" class="body">UID / SELinux 决定真实访问权限，调用桥接不会改变客户端身份。</text>
  </g>
</svg>
