<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 286" role="img" aria-labelledby="pr-adb-title pr-adb-desc" class="pr-adb-diagram">
  <title id="pr-adb-title">先授权和配对，再连接并探测 UID</title>
  <desc id="pr-adb-desc">用户先开启系统无线调试。PocketRun 使用配对端口和六位码授权自己的 ADB 身份，再用另一个连接端口建立 TLS ADB transport，最后执行固定 id -u，验证返回 shell UID 2000。两次网络连接都只访问手机本机 127.0.0.1；App 自身 UID 不改变。断开关闭 transport，不撤销系统配对授权。</desc>
  <style>
    .pr-adb-diagram .card { fill: var(--panel); stroke: var(--border); stroke-width: 1.5; }
    .pr-adb-diagram .edge { fill: none; stroke: var(--muted); stroke-width: 2; }
    .pr-adb-diagram .heading { fill: var(--ink); font-size: 24px; font-weight: 650; }
    .pr-adb-diagram .body { fill: var(--ink); font-size: 20px; font-weight: 650; }
    .pr-adb-diagram .label { fill: var(--muted); font-size: 16px; }
  </style>
  <defs><marker id="pr-adb-arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 9 4 0 8Z" fill="var(--muted)"/></marker></defs>
  <text x="510" y="34" class="heading" text-anchor="middle">怎样得到可用的 shell 启动入口？</text>
  <g data-node="authorize">
    <rect x="20" y="78" width="200" height="126" rx="10" class="card"/>
    <text x="120" y="117" class="body" text-anchor="middle">开启系统调试</text>
    <text x="120" y="152" class="label" text-anchor="middle">用户确认授权</text>
    <text x="120" y="183" class="label" text-anchor="middle">不是 App 自行提权</text>
  </g>
  <path d="M220 141 H280" class="edge" marker-end="url(#pr-adb-arrow)"/>
  <g data-node="pair">
    <rect x="280" y="78" width="200" height="126" rx="10" class="card"/>
    <text x="380" y="117" class="body" text-anchor="middle">配对 App 身份</text>
    <text x="380" y="152" class="label" text-anchor="middle">配对端口 + 六位码</text>
    <text x="380" y="183" class="label" text-anchor="middle">系统保存公钥</text>
  </g>
  <path d="M480 141 H540" class="edge" marker-end="url(#pr-adb-arrow)"/>
  <g data-node="connect">
    <rect x="540" y="78" width="200" height="126" rx="10" class="card"/>
    <text x="640" y="117" class="body" text-anchor="middle">建立 TLS 连接</text>
    <text x="640" y="152" class="label" text-anchor="middle">连接端口 + 已配对身份</text>
    <text x="640" y="183" class="label" text-anchor="middle">连接本机 adbd</text>
  </g>
  <path d="M740 141 H800" class="edge" marker-end="url(#pr-adb-arrow)"/>
  <g data-node="probe">
    <rect x="800" y="78" width="200" height="126" rx="10" class="card"/>
    <text x="900" y="117" class="body" text-anchor="middle">探测执行身份</text>
    <text x="900" y="152" class="label" text-anchor="middle">固定 id -u → 2000</text>
    <text x="900" y="183" class="label" text-anchor="middle">Promise 返回数字</text>
  </g>
  <text x="510" y="243" class="body" text-anchor="middle">配对与连接都只访问手机本机 127.0.0.1；App UID 始终不变。</text>
  <text x="510" y="272" class="label" text-anchor="middle">身份已配对时可跳过配对；结束时断开 transport，系统授权仍保留。</text>
</svg>
