<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 286" role="img" aria-labelledby="pr-backend-title pr-backend-desc" class="pr-backend-diagram">
  <title id="pr-backend-title">怎样从 ADB 启动转到 Binder 调用</title>
  <desc id="pr-backend-desc">已有本机 ADB 连接时，App 先准备一次性交换，再发送固定 app_process 启动命令。后端以 UID 2000 运行并送回 Binder。交换成功后可以断开 ADB，再用 Binder ping 检查同一个 PID，最后通过 Binder shutdown 停止后端。这是阶段顺序，不是进程分层。</desc>
  <style>
    .pr-backend-diagram .card { fill: var(--panel); stroke: var(--border); stroke-width: 1.5; }
    .pr-backend-diagram .edge { fill: none; stroke: var(--muted); stroke-width: 2; }
    .pr-backend-diagram .heading { fill: var(--ink); font-size: 24px; font-weight: 650; }
    .pr-backend-diagram .body { fill: var(--ink); font-size: 20px; font-weight: 650; }
    .pr-backend-diagram .label { fill: var(--muted); font-size: 16px; }
  </style>
  <defs><marker id="pr-backend-arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 9 4 0 8Z" fill="var(--muted)"/></marker></defs>
  <text x="510" y="34" class="heading" text-anchor="middle">先启动，再交换，之后只用 Binder</text>
  <g data-node="launch">
    <rect x="20" y="78" width="200" height="126" rx="10" class="card"/>
    <text x="120" y="117" class="body" text-anchor="middle">启动后端</text>
    <text x="120" y="152" class="label" text-anchor="middle">ADB 固定启动命令</text>
    <text x="120" y="183" class="label" text-anchor="middle">UID 2000 独立进程</text>
  </g>
  <path d="M220 141 H280" class="edge" marker-end="url(#pr-backend-arrow)"/>
  <g data-node="exchange">
    <rect x="280" y="78" width="200" height="126" rx="10" class="card"/>
    <text x="380" y="117" class="body" text-anchor="middle">交换 Binder</text>
    <text x="380" y="152" class="label" text-anchor="middle">校验本次 token 与身份</text>
    <text x="380" y="183" class="label" text-anchor="middle">得到可调用句柄</text>
  </g>
  <path d="M480 141 H540" class="edge" marker-end="url(#pr-backend-arrow)"/>
  <g data-node="ping">
    <rect x="540" y="78" width="200" height="126" rx="10" class="card"/>
    <text x="640" y="117" class="body" text-anchor="middle">检查后端</text>
    <text x="640" y="152" class="label" text-anchor="middle">断开 ADB 后 ping</text>
    <text x="640" y="183" class="label" text-anchor="middle">pong / 同一个 PID</text>
  </g>
  <path d="M740 141 H800" class="edge" marker-end="url(#pr-backend-arrow)"/>
  <g data-node="stop">
    <rect x="800" y="78" width="200" height="126" rx="10" class="card"/>
    <text x="900" y="117" class="body" text-anchor="middle">停止后端</text>
    <text x="900" y="152" class="label" text-anchor="middle">Binder shutdown</text>
    <text x="900" y="183" class="label" text-anchor="middle">进程退出，状态清空</text>
  </g>
  <text x="510" y="243" class="body" text-anchor="middle">启动前先准备交换窗口；收到 Binder 并核对 UID 后才判为就绪。</text>
  <text x="510" y="272" class="label" text-anchor="middle">断开 ADB 只关闭启动通道，不会停止已经建立的后端。</text>
</svg>
