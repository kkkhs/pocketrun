<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="pr-backend-title pr-backend-desc" class="pr-backend-diagram">
  <title id="pr-backend-title">ADB 启动 shell 后端并交换 Binder 的流程</title>
  <desc id="pr-backend-desc">普通 App 先通过已配对的本机 ADB 发送固定启动命令。adbd 以 shell UID 2000 启动 app_process 后端。后端携带一次性 token 调用导出的 Binder exchange Provider，Provider 验证 shell UID、token 和接口 descriptor 后把后端 Binder 交给 App，同时返回 App client token。之后 App 断开 ADB，仍通过 Binder ping 后端。</desc>
  <style>
    .pr-backend-diagram { --app: #2a78d6; --shell: #eb6834; --ink: var(--ifm-font-color-base, #1c1e21); --muted: var(--ifm-color-emphasis-700, #606770); --border: var(--ifm-color-emphasis-300, #dadde1); --panel: var(--ifm-background-surface-color, #fff); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    html[data-theme="dark"] .pr-backend-diagram { --app: #3987e5; --shell: #d95926; }
    .pr-backend-diagram .card { fill: var(--panel); stroke: var(--border); stroke-width: 1.5; }
    .pr-backend-diagram .edge { fill: none; stroke: var(--muted); stroke-width: 2; }
    .pr-backend-diagram .heading { fill: var(--ink); font-size: 23px; font-weight: 650; }
    .pr-backend-diagram .body { fill: var(--ink); font-size: 18px; }
    .pr-backend-diagram .label { fill: var(--muted); font-size: 16px; }
  </style>
  <defs><marker id="pr-backend-arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 9 4 0 8Z" fill="var(--muted)"/></marker></defs>

  <text x="24" y="30" class="heading">启动阶段</text>
  <text x="142" y="30" class="label">ADB 只在这一段出现</text>
  <g data-node="app">
    <rect x="24" y="55" width="232" height="110" rx="10" class="card"/>
    <rect x="24" y="66" width="4" height="88" rx="2" fill="var(--app)"/>
    <text x="47" y="96" class="heading">PocketRun App</text>
    <text x="47" y="130" class="body">普通 App UID</text>
  </g>
  <path d="M256 110 H334" class="edge" marker-end="url(#pr-backend-arrow)"/>
  <text x="295" y="96" class="label" text-anchor="middle">固定 shell 命令</text>
  <g data-node="adbd">
    <rect x="334" y="55" width="205" height="110" rx="10" class="card"/>
    <text x="357" y="96" class="heading">本机 adbd</text>
    <text x="357" y="130" class="body">验证已配对身份</text>
  </g>
  <path d="M539 110 H617" class="edge" marker-end="url(#pr-backend-arrow)"/>
  <text x="578" y="96" class="label" text-anchor="middle">setsid</text>
  <g data-node="backend">
    <rect x="617" y="55" width="259" height="110" rx="10" class="card"/>
    <rect x="872" y="66" width="4" height="88" rx="2" fill="var(--shell)"/>
    <text x="640" y="96" class="heading">app_process 后端</text>
    <text x="640" y="130" class="body">shell UID 2000</text>
  </g>

  <path d="M746 165 V235 H570" class="edge" marker-end="url(#pr-backend-arrow)"/>
  <text x="677" y="218" class="label">一次性 token + backend Binder</text>
  <g data-node="provider">
    <rect x="325" y="235" width="245" height="126" rx="10" class="card"/>
    <text x="348" y="274" class="heading">Exchange Provider</text>
    <text x="348" y="308" class="body">验 UID / token / descriptor</text>
    <text x="348" y="338" class="label">成功一次后立即清空 token</text>
  </g>
  <path d="M325 298 H256" class="edge" marker-end="url(#pr-backend-arrow)"/>
  <text x="290" y="284" class="label" text-anchor="middle">Binder</text>
  <path d="M570 330 H746 V165" class="edge" stroke-dasharray="6 5" marker-end="url(#pr-backend-arrow)"/>
  <text x="674" y="353" class="label">App client token（监听死亡）</text>

  <text x="24" y="410" class="heading">运行阶段</text>
  <text x="142" y="410" class="label">ADB 可以断开</text>
  <g data-node="binder-client">
    <rect x="150" y="437" width="246" height="98" rx="10" class="card"/>
    <rect x="150" y="447" width="4" height="78" rx="2" fill="var(--app)"/>
    <text x="174" y="475" class="heading">App Controller</text>
    <text x="174" y="508" class="body">typed Binder proxy</text>
  </g>
  <path d="M396 486 H504" class="edge" marker-end="url(#pr-backend-arrow)"/>
  <path d="M504 510 H396" class="edge" marker-end="url(#pr-backend-arrow)"/>
  <text x="450" y="472" class="label" text-anchor="middle">ping()</text>
  <text x="450" y="535" class="label" text-anchor="middle">pong / UID / PID</text>
  <g data-node="binder-service">
    <rect x="504" y="437" width="246" height="98" rx="10" class="card"/>
    <rect x="746" y="447" width="4" height="78" rx="2" fill="var(--shell)"/>
    <text x="528" y="475" class="heading">shell 后端</text>
    <text x="528" y="508" class="body">校验 App 调用 UID</text>
  </g>
</svg>
