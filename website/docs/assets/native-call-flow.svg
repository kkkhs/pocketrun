<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 254" role="img" aria-labelledby="pr-native-title pr-native-desc" class="pr-native-diagram">
  <title id="pr-native-title">一次点击怎样得到设备信息</title>
  <desc id="pr-native-desc">React 按钮通过 TurboModule 调用同一 App 进程内的 Kotlin getDeviceInfo。Kotlin 读取 Build 和 Process，通过 Promise 返回结果，React 更新显示。Codegen 在构建期完成，不属于点击后的运行步骤。</desc>
  <style>
    .pr-native-diagram .card { fill: var(--panel); stroke: var(--border); stroke-width: 1.5; }
    .pr-native-diagram .edge { fill: none; stroke: var(--muted); stroke-width: 2; }
    .pr-native-diagram .heading { fill: var(--ink); font-size: 24px; font-weight: 650; }
    .pr-native-diagram .body { fill: var(--ink); font-size: 20px; }
    .pr-native-diagram .label { fill: var(--muted); font-size: 16px; }
  </style>
  <defs><marker id="pr-native-arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 9 4 0 8Z" fill="var(--muted)"/></marker></defs>
  <text x="470" y="34" class="heading" text-anchor="middle">点击后，信息怎样回到页面？</text>
  <g data-node="request">
    <rect x="20" y="78" width="220" height="112" rx="10" class="card"/>
    <text x="130" y="117" class="heading" text-anchor="middle">点击按钮</text>
    <text x="130" y="150" class="body" text-anchor="middle">React 发起请求</text>
    <text x="130" y="177" class="label" text-anchor="middle">getDeviceInfo()</text>
  </g>
  <path d="M240 134 H360" class="edge" marker-end="url(#pr-native-arrow)"/>
  <text x="300" y="118" class="label" text-anchor="middle">TurboModule</text>
  <g data-node="read">
    <rect x="360" y="78" width="220" height="112" rx="10" class="card"/>
    <text x="470" y="117" class="heading" text-anchor="middle">读取信息</text>
    <text x="470" y="150" class="body" text-anchor="middle">App Kotlin 执行</text>
    <text x="470" y="177" class="label" text-anchor="middle">Build / Process</text>
  </g>
  <path d="M580 134 H700" class="edge" marker-end="url(#pr-native-arrow)"/>
  <text x="640" y="118" class="label" text-anchor="middle">Promise 结果</text>
  <g data-node="render">
    <rect x="700" y="78" width="220" height="112" rx="10" class="card"/>
    <text x="810" y="117" class="heading" text-anchor="middle">显示结果</text>
    <text x="810" y="150" class="body" text-anchor="middle">React 更新状态</text>
    <text x="810" y="177" class="label" text-anchor="middle">四个字段或错误</text>
  </g>
  <text x="470" y="232" class="label" text-anchor="middle">同一个 App 进程，始终保持普通 App UID；Codegen 不在点击时运行。</text>
</svg>
