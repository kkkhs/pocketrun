<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 690" role="img" aria-labelledby="pr-memory-title pr-memory-desc" class="pr-memory-diagram">
  <title id="pr-memory-title">一条用户笔记怎样进入下一次模型任务</title>
  <desc id="pr-memory-desc">用户在手机保存笔记，原生将带版本的快照加密存入私有无备份目录。开始下一任务时，用户选择笔记并确认当前模型地址；原生检查版本与地址，生成不可变的所选快照，把它作为不可信偏好数据放入初始用户消息。模型工具仍由原TaskHost校验和手机批准。修改或删除先取消旧循环，不撤回模型已经收到的数据。</desc>
  <style>
    .pr-memory-diagram { --ink: var(--ifm-font-color-base, #1c1e21); --muted: var(--ifm-color-emphasis-700, #606770); --border: var(--ifm-color-emphasis-300, #dadde1); --panel: var(--ifm-background-surface-color, #fff); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pr-memory-diagram .heading { fill: var(--ink); font-size: 24px; font-weight: 650; }
    .pr-memory-diagram .body { fill: var(--ink); font-size: 21px; }
    .pr-memory-diagram .note { fill: var(--muted); font-size: 19px; }
    .pr-memory-diagram .card { fill: var(--panel); stroke: var(--border); stroke-width: 1.5; }
    .pr-memory-diagram .edge { fill: none; stroke: var(--muted); stroke-width: 2; }
  </style>
  <defs><marker id="pr-memory-arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 9 4 0 8Z" fill="var(--muted)"/></marker></defs>
  <text x="280" y="34" text-anchor="middle" class="heading">用户笔记 → 所选快照 → 下一任务的数据</text>
  <rect x="30" y="64" width="500" height="86" rx="10" class="card"/>
  <text x="52" y="99" class="heading">1 · 保存或纠正笔记</text>
  <text x="52" y="131" class="body">手机编辑 → 原生核对当前 revision</text>
  <path d="M280 150 V192" class="edge" marker-end="url(#pr-memory-arrow)"/>
  <rect x="30" y="192" width="500" height="86" rx="10" class="card"/>
  <text x="52" y="227" class="heading">2 · 留下带版本的快照</text>
  <text x="52" y="259" class="body">Keystore 加密 → 私有 AtomicFile</text>
  <path d="M280 278 V320" class="edge" marker-end="url(#pr-memory-arrow)"/>
  <rect x="30" y="320" width="500" height="108" rx="10" class="card"/>
  <text x="52" y="355" class="heading">3 · 明确选择并确认发送</text>
  <text x="52" y="387" class="body">笔记 IDs + revision + 模型地址</text>
  <text x="52" y="415" class="body">原生重查，取得不可变快照</text>
  <path d="M280 428 V470" class="edge" marker-end="url(#pr-memory-arrow)"/>
  <rect x="30" y="470" width="500" height="86" rx="10" class="card"/>
  <text x="52" y="505" class="heading">4 · 初始 user 消息</text>
  <text x="52" y="537" class="body">目标 + 当前环境 + 不可信偏好数据</text>
  <path d="M280 556 V598" class="edge" marker-end="url(#pr-memory-arrow)"/>
  <text x="280" y="628" text-anchor="middle" class="body">模型提出工具 → 原 TaskHost 校验与批准</text>
  <text x="280" y="667" text-anchor="middle" class="note">记忆可以影响表达，不能授予工具权限。</text>
</svg>
