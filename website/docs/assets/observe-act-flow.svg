<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 880" role="img" aria-labelledby="pr-oa-title pr-oa-desc" class="pr-oa-diagram">
  <title id="pr-oa-title">填写输入框的任务顺序：准备、观察、定位、操作、核对、结束</title>
  <desc id="pr-oa-desc">先按需连接本机 ADB、启动 shell 后端和建立 Binder，再创建虚拟屏并保存 displayId。之后按顺序读取截图和 UI 树，从树中找到输入框，点击中心并输入固定文字，再读取截图和树确认文字，最后释放虚拟屏和停止后端。当前由用户依次点击按钮驱动这些阶段，不是已经实现的自动 Agent 循环。</desc>
  <style>
    .pr-oa-diagram { --ink: var(--ifm-font-color-base, #1c1e21); --muted: var(--ifm-color-emphasis-700, #606770); --border: var(--ifm-color-emphasis-300, #dadde1); --panel: var(--ifm-background-surface-color, #fff); --app: #2a78d6; --shell: #eb6834; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pr-oa-diagram .title { fill: var(--ink); font-size: 28px; font-weight: 650; }
    .pr-oa-diagram .heading { fill: var(--ink); font-size: 24px; font-weight: 650; }
    .pr-oa-diagram .body { fill: var(--muted); font-size: 20px; }
    .pr-oa-diagram .card { fill: var(--panel); stroke: var(--border); stroke-width: 1.5; }
    .pr-oa-diagram .edge { fill: none; stroke: var(--muted); stroke-width: 2; }
  </style>
  <defs><marker id="pr-oa-arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 9 4 0 8Z" fill="var(--muted)"/></marker></defs>
  <text x="400" y="38" text-anchor="middle" class="title">任务顺序：先准备，再执行一轮</text>

  <rect x="30" y="80" width="740" height="105" rx="10" class="card"/>
  <text x="56" y="112" class="heading">会话准备 · 按需启动一次</text>
  <text x="56" y="144" class="body">App 连本机 ADB → 启动后端，Binder 就绪</text>
  <text x="56" y="172" class="body">创建虚拟屏并打开 Demo → 保存 displayId</text>
  <path d="M400 185 V245" class="edge" marker-end="url(#pr-oa-arrow)"/>

  <rect x="30" y="245" width="740" height="64" rx="8" class="card"/>
  <text x="56" y="284" class="heading">1 · 看界面</text>
  <text x="286" y="284" class="body">读取截图和 UI 树</text>
  <path d="M400 309 V369" class="edge" marker-end="url(#pr-oa-arrow)"/>

  <rect x="30" y="369" width="740" height="64" rx="8" class="card"/>
  <text x="56" y="408" class="heading">2 · 找输入框</text>
  <text x="286" y="408" class="body">从树中找到目标，算出中心坐标</text>
  <path d="M400 433 V493" class="edge" marker-end="url(#pr-oa-arrow)"/>

  <rect x="30" y="493" width="740" height="64" rx="8" class="card"/>
  <text x="56" y="532" class="heading">3 · 点击并填字</text>
  <text x="286" y="532" class="body">向同一 displayId 发送输入事件</text>
  <path d="M400 557 V617" class="edge" marker-end="url(#pr-oa-arrow)"/>

  <rect x="30" y="617" width="740" height="64" rx="8" class="card"/>
  <text x="56" y="656" class="heading">4 · 检查结果</text>
  <text x="286" y="656" class="body">再读截图和树，确认文字实际改变</text>
  <path d="M400 681 V741" class="edge" marker-end="url(#pr-oa-arrow)"/>

  <rect x="30" y="741" width="740" height="64" rx="8" class="card"/>
  <text x="56" y="780" class="heading">5 · 结束任务</text>
  <text x="286" y="780" class="body">释放虚拟屏；本次演示结束后停止后端</text>
  <text x="400" y="859" text-anchor="middle" class="body">当前由用户依次点按钮；第 1—4 步可以复用已就绪的会话。</text>
</svg>
