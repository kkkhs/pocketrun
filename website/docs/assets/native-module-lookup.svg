<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 286" role="img" aria-labelledby="pr-lookup-title pr-lookup-desc" class="pr-lookup-diagram">
  <title id="pr-lookup-title">PocketRunDevice 这个名字怎样对应到 Kotlin 实现</title>
  <desc id="pr-lookup-desc">JavaScript 用 PocketRunDevice 查找模块。MainApplication 已把 DeviceInfoPackage 加入 ReactHost；Package 向 React Native 登记相同名字，并在 getModule 中提供 DeviceInfoModule。原生模块的 NAME 也必须是 PocketRunDevice。React Native 管理原生实例并向 JS 返回代理；Spec 和 Codegen 库名不是运行时查找键。</desc>
  <style>
    .pr-lookup-diagram .card { fill: var(--panel); stroke: var(--border); stroke-width: 1.5; }
    .pr-lookup-diagram .edge { fill: none; stroke: var(--muted); stroke-width: 2; }
    .pr-lookup-diagram .heading { fill: var(--ink); font-size: 24px; font-weight: 650; }
    .pr-lookup-diagram .body { fill: var(--ink); font-size: 20px; }
    .pr-lookup-diagram .label { fill: var(--muted); font-size: 16px; }
  </style>
  <defs><marker id="pr-lookup-arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 9 4 0 8Z" fill="var(--muted)"/></marker></defs>
  <text x="470" y="34" class="heading" text-anchor="middle">同一个查找名，对应同一个原生实现</text>
  <g data-node="js">
    <rect x="20" y="78" width="240" height="126" rx="10" class="card"/>
    <text x="140" y="117" class="heading" text-anchor="middle">JS 查找名</text>
    <text x="140" y="152" class="body" text-anchor="middle">PocketRunDevice</text>
    <text x="140" y="183" class="label" text-anchor="middle">TurboModuleRegistry.get</text>
  </g>
  <path d="M260 141 H350" class="edge" marker-end="url(#pr-lookup-arrow)"/>
  <text x="305" y="124" class="label" text-anchor="middle">按名查找</text>
  <g data-node="package">
    <rect x="350" y="78" width="240" height="126" rx="10" class="card"/>
    <text x="470" y="117" class="heading" text-anchor="middle">Package 登记名</text>
    <text x="470" y="152" class="body" text-anchor="middle">PocketRunDevice</text>
    <text x="470" y="183" class="label" text-anchor="middle">DeviceInfoPackage</text>
  </g>
  <path d="M590 141 H680" class="edge" marker-end="url(#pr-lookup-arrow)"/>
  <text x="635" y="124" class="label" text-anchor="middle">提供实现</text>
  <g data-node="native">
    <rect x="680" y="78" width="240" height="126" rx="10" class="card"/>
    <text x="800" y="117" class="heading" text-anchor="middle">原生模块名</text>
    <text x="800" y="152" class="body" text-anchor="middle">PocketRunDevice</text>
    <text x="800" y="183" class="label" text-anchor="middle">DeviceInfoModule.NAME</text>
  </g>
  <text x="470" y="243" class="body" text-anchor="middle">MainApplication 注册 Package；RN 管理实例，JS 得到可调用代理。</text>
  <text x="470" y="272" class="label" text-anchor="middle">Spec 是接口约定，PocketRunSpecs 是 Codegen 库名，都不是查找键。</text>
</svg>
